name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest] } }   # macOS / Windows: not verified yet (see README)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.20.0' }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:ci   # same files as npm test; failed tests become annotations
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # gitleaks reads the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.20.0' }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low   # any advisory fails; an accepted exception is documented in SECURITY.md
      - run: npm audit signatures          # registry signatures (and provenance where published) of every dependency
      - name: gitleaks 8.30.1 (binary pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .'
  package:
    runs-on: ubuntu-latest   # the npm package installed for real (DoD 1, Linux; macOS/Windows: R7)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.20.0' }
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: npm pack ./dist/package --pack-destination "$RUNNER_TEMP" --ignore-scripts
      - run: npm install -g --ignore-scripts "$RUNNER_TEMP"/taskquoin-*.tgz
      - name: the installed taskquoin runs (version, init, doctor)
        run: |
          taskquoin version
          cd "$(mktemp -d)" && git init -q
          taskquoin init
          taskquoin doctor > doctor.txt || true   # agents without a runtime are refused here: only the install is checked
          cat doctor.txt
          grep -F 'PreToolUse hook entry: ✔' doctor.txt
