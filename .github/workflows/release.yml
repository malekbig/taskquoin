name: Release
# Publishes the npm package `taskquoin` with provenance. A pushed tag brings its own copy of this file, so the
# signature check below is one layer; THE GATE is the protected environment `npm-publish` (required reviewer,
# v* tags only), to which the npm trusted publisher is bound. Settings this file relies on: SECURITY.md.
on: { push: { tags: ['v*'] } }
permissions: { contents: read }
jobs:
  build:   # no OIDC token, no secret: verifies the tag, tests, builds and packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: re-fetch the annotated tag (checkout leaves a lightweight copy)
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: signers come from main, not from the tag
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
      - name: the tag is signed by an allowed maintainer key
        run: git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$GITHUB_REF_NAME"
      - name: the signed tag is the commit being built
        run: test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
      - name: the tag names the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.20.0' }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm audit --audit-level=low
      - run: npm run package
      - run: mkdir -p "$RUNNER_TEMP/pkg" && npm pack ./dist/package --pack-destination "$RUNNER_TEMP/pkg" --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg/taskquoin-*.tgz
          if-no-files-found: error
          retention-days: 1
  publish:   # runs no repository code: publishes the tarball `build` produced
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish   # protected (required reviewer, v* tags only); the npm trusted publisher names it
    permissions: { contents: read, id-token: write }   # id-token: npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.20.0', registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g --ignore-scripts npm@11.21.1   # trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm publish "$RUNNER_TEMP"/pkg/taskquoin-*.tgz --provenance --access public
        env:
          # First publish only, as a secret of the `npm-publish` ENVIRONMENT (never a repository secret): npm trusted
          # publishing can only be configured once the package exists. Delete it afterwards; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
